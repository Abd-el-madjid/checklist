# Config for a plain Worker deployment (wrangler deploy), which is what
# produces a *.workers.dev URL like checklist.<account>.workers.dev.
#
# One-time setup:
#   1. Build the app:                npm run build
#   2. Create the KV namespace:      wrangler kv namespace create STATE_KV
#   3. Paste the id it prints below, replacing REPLACE_WITH_YOUR_KV_NAMESPACE_ID
#   4. Deploy:                       wrangler deploy
#
# Redeploy any time by re-running steps 1 and 4.

name = "checklist"
main = "worker/index.js"
compatibility_date = "2024-09-01"

# Serves the built React app (dist/) for any request that isn't /api/state.
# worker/index.js does `env.ASSETS.fetch(request)` for that fallback.
[assets]
directory = "./dist"
binding = "ASSETS"

# Shared checklist state (see worker/index.js) — same KV namespace used by
# every visitor, which is what makes changes show up on every device.
[[kv_namespaces]]
binding = "STATE_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# ---------------------------------------------------------------------------
# Deploying through Cloudflare PAGES instead (Git integration, or
# `wrangler pages deploy`) uses a different mechanism entirely — Pages
# doesn't read this file. It auto-detects functions/api/state.js and you'd
# instead bind STATE_KV under Settings → Functions → KV namespace bindings
# in the dashboard. Pick ONE deployment method (Worker or Pages) — the file
# for the other one you're not using is simply unused, not a conflict.
# ---------------------------------------------------------------------------
